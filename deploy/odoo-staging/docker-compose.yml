name: epoxiron-odoo-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
    networks:
      - odoo_staging

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - odoo
      - --database=${POSTGRES_DB}
      - --db_host=postgres
      - --db_port=5432
      - --db_user=${POSTGRES_USER}
      - --db_password=${POSTGRES_PASSWORD}
      - --admin-passwd=${ODOO_ADMIN_PASSWD}
      - --addons-path=/mnt/enterprise-addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      - --proxy-mode
      - --without-demo=all
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo_filestore:/var/lib/odoo
      - ./enterprise:/mnt/enterprise-addons:ro
      - ./extra-addons:/mnt/extra-addons:ro
    networks:
      - odoo_staging

networks:
  odoo_staging:
    name: epoxiron_odoo_staging

volumes:
  odoo_postgres_data:
    name: epoxiron_odoo_staging_postgres
  odoo_filestore:
    name: epoxiron_odoo_staging_filestore

